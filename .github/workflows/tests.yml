name: Tests

# R13: 299+ tests ran automatically by nobody -- pytest was never wired into
# CI, so a regression only surfaced when someone happened to run it locally.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install techinves (api-dev + pipeline extras)
        run: pip install -e ".[api-dev,pipeline]"

      - name: Run pytest
        run: pytest -q
